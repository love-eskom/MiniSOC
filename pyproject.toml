[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minisoc"
version = "0.1.0"
description = "A lightweight educational SOC platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]